name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -project AppKOPLOP.xcodeproj \
            -scheme AppKOPLOP \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/AppKOPLOP.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tail -n 120

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/AppKOPLOP.xcarchive/Products/Applications/AppKOPLOP.app"
          ls -la "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr AppKOPLOP-unsigned.ipa Payload
          ls -lh AppKOPLOP-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppKOPLOP-ipa
          path: ${{ runner.temp }}/AppKOPLOP-unsigned.ipa
          if-no-files-found: error
